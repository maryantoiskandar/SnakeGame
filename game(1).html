<body>

  <h1>Game Ular</h1>

  <canvas id="gamecanvas" width="1000" height="400"></canvas>

    <button onclick="toggleMusic()">Mute/Unmute Music</button>
  </div>

  <video id="bgvideo" autoplay muted loop playsinline>

</video>


  <script src="script.js"></script>
